services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LAGOON_LOCALDEV_HTTP_PORT: 8080
      LAGOON_ROUTE: https://zs-sean-backend.docker.amazee.io
    networks:
      - amazeeio-network
      - default
    labels:
      lagoon.type: basic
      lagoon.service.usecomposeports: true
    ports:
      - "8080"

networks:
  amazeeio-network:
    external: true