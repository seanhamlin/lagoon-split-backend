### Nginx configuration: Drupal is mounted at /cms (and /api), everything else
### is proxied to the frontend. Replaces the image's default Drupal app.conf.

# Path inside the Drupal webroot for a /cms request (/cms/core/misc/drupal.js -> /core/misc/drupal.js).
map $uri $cms_path {
  ~^/cms(?<path>/.*)$  $path;
  default              /;
}

# Preserve the original scheme from the Lagoon router when proxying to the frontend.
map $http_x_forwarded_proto $frontend_forwarded_proto {
  default  $http_x_forwarded_proto;
  ''       $scheme;
}

server {
  include /etc/nginx/conf.d/drupal/server_prepend*.conf;

  listen ${NGINX_LISTEN:-8080} default_server;
  large_client_header_buffers 4 32k;

  # Keep redirect Location headers relative so https is preserved behind the Lagoon router.
  absolute_redirect off;

  include /etc/nginx/helpers/*.conf;

  root /app/${WEBROOT:-};
  index  index.php;

  ## rewriting /cms/index.php to /cms/ because after https://www.drupal.org/node/2599326
  ## autocomplete URLs are forced to go to index.php
  rewrite ^/cms/index.php /cms/ last;

  ## Drupal only detects its /cms base path with the trailing slash.
  location = /cms {
    return 301 /cms/$is_args$args;
  }

  ## Drupal, mounted at /cms. Files are looked up with the /cms prefix stripped.
  location ^~ /cms/ {
    include /etc/nginx/conf.d/drupal/location_prepend*.conf;

    ## This has to come before any *.txt path-based blocking
    ## Support for the securitytxt module
    ## http://drupal.org/project/securitytxt.
    ## RFC8615 standard path.
    location ~* /\.well-known/security\.txt(\.sig)?$ {
      access_log off;
      try_files $cms_path @drupal;
    }

    ## Do not allow access to .txt and .md unless inside public or private files
    ## directories (sites/*/files and sytem/files)
    location ~* ^(?!.+(?:sites\/.+|system)\/files\/).+\.(txt|md)$ {
      deny all;
      access_log off;
      log_not_found off;
    }

    ## Replicate the Apache <FilesMatch> directive of Drupal standard
    ## .htaccess. Disable access to any code files. Return a 404 to curtail
    ## information disclosure.
    location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|.*sql\.gz|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|^\/cms\/(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template)$|(composer\.(json|lock)|web\.config|yarn\.lock|package(-lock)?\.json)$|^\/cms\/#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
      deny all;
      access_log off;
      log_not_found off;
      return 404;
    }

    ## Expiring per default for four weeks and one second, Drupal will overwrite that if necessary
    expires ${NGINX_DEFAULT_EXPIRES:-2628001s};

    ## Disallow access to any dot files, but send the request to Drupal
    location ~* /\. {
      try_files /dev/null @drupal;
    }

    ### Directives for installing drupal.
    location ~* ^/cms(?<cms_install>/(core/)?install\.php)$ {
      include        /etc/nginx/fastcgi.conf;
      fastcgi_param  SCRIPT_NAME        /cms$cms_install;
      fastcgi_param  SCRIPT_FILENAME    $realpath_root$cms_install;
      fastcgi_pass   ${NGINX_FASTCGI_PASS:-php}:9000;
    }

    ## Direct Access to .php files is not allowed and is sent to Drupal instead
    location ~* ^.+\.php$ {
      try_files /dev/null @drupal;
    }

    ## Trying to access private files directly returns a 404.
    location ^~ /cms/sites/default/files/private/ {
      internal;
    }

    ## Disallow access to patches, backup, vagrant and vendor directories.
    location ~ ^/cms/(patches|backup|vagrant|vendor|core/vendor)/ {
      deny all;
      access_log off;
      log_not_found off;
    }

    ## Try to find a file with given URL, if not pass to Drupal
    try_files $cms_path @drupal;

    include /etc/nginx/conf.d/drupal/location_append*.conf;
  }

  ## API paths are served by Drupal as if requested under /cms
  ## (/api/foo is handled as /cms/api/foo), so Drupal sees the path /api/foo
  ## and generates URLs and session names for the /cms base path.
  location ~ ^/api(/|$) {
    include        /etc/nginx/fastcgi.conf;
    fastcgi_param  SCRIPT_NAME        /cms/index.php;
    fastcgi_param  SCRIPT_FILENAME    $realpath_root/index.php;
    fastcgi_param  REQUEST_URI        /cms$request_uri;
    fastcgi_pass   ${NGINX_FASTCGI_PASS:-php}:9000;
  }

  ## Main Drupal Location
  location @drupal {
    include /etc/nginx/conf.d/drupal/location_drupal_prepend*.conf;

    include        /etc/nginx/fastcgi.conf;
    fastcgi_param  SCRIPT_NAME        /cms/index.php;
    fastcgi_param  SCRIPT_FILENAME    $realpath_root/index.php;
    fastcgi_pass   ${NGINX_FASTCGI_PASS:-php}:9000;

    include /etc/nginx/conf.d/drupal/location_drupal_append*.conf;
  }

  ## Everything else is served by the frontend.
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $frontend_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass http://${FRONTEND_HOST:-node.zs-sean-frontend-dev.svc}:${FRONTEND_PORT:-3000};
  }

  include /etc/nginx/conf.d/drupal/server_append*.conf;
}
